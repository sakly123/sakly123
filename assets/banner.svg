<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Ahlem Sakly, Cloud Computing and Cybersecurity" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --accent: #0d9488;
      --line: #d1d9e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #f0f6fc;
        --muted: #9198a1;
        --accent: #2dd4bf;
        --line: #30363d;
      }
    }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { font-size: 11px; letter-spacing: 3px; fill: var(--muted); }
    .name { font-size: 46px; font-weight: 700; fill: var(--fg); }
    .sub { font-size: 17px; fill: var(--muted); }

    .fade { opacity: 0; animation: fadeUp 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.2s; }
    .d2 { animation-delay: 0.5s; }
    .d3 { animation-delay: 0.8s; }
    .d4 { animation-delay: 1.1s; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .rule { stroke: var(--line); stroke-width: 1; stroke-dasharray: 820; stroke-dashoffset: 820; animation: draw 1.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .accent-bar { fill: var(--accent); transform-origin: 40px 116px; transform: scaleY(0); animation: grow 0.7s ease-out 0.3s forwards; }
    @keyframes grow { to { transform: scaleY(1); } }

    .sweep { animation: sweep 6s ease-in-out 1.5s infinite; }
    @keyframes sweep {
      0%   { transform: translateX(0); }
      70%, 100% { transform: translateX(1140px); }
    }
  </style>

  <defs>
    <linearGradient id="trail" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0d9488" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="frame"><rect width="900" height="220"/></clipPath>
  </defs>

  <rect width="900" height="220" fill="var(--bg)"/>

  <g clip-path="url(#frame)">
    <g class="sweep">
      <rect x="-240" y="0" width="240" height="220" fill="url(#trail)"/>
      <rect x="-3" y="0" width="3" height="220" fill="var(--accent)"/>
    </g>
  </g>

  <text class="mono label fade d1" x="40" y="42">CYBERSECURITY · CLOUD COMPUTING</text>
  <line class="rule" x1="40" y1="56" x2="860" y2="56"/>

  <rect class="accent-bar" x="40" y="80" width="4" height="72"/>
  <text class="sans name fade d2" x="62" y="118">Ahlem Sakly</text>
  <text class="sans sub fade d3" x="62" y="148">Engineering student · ESPRIM · Monastir, Tunisia</text>

  <line class="rule" x1="40" y1="176" x2="860" y2="176"/>
  <text class="mono label fade d4" x="40" y="199">APPLICATION SECURITY · WEB &amp; API PENTESTING · DEVSECOPS</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
